name: CI

on:
  push:
    branches: [feat/aani-sandbox-financial]
  pull_request:
    branches: [feat/aani-sandbox-financial]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Validate SQL syntax
        run: |
          # Validate that the migration SQL file is syntactically parseable
          # using psql --dry-run if available, otherwise check with pg_format
          if command -v psql >/dev/null 2>&1; then
            psql --dry-run -f artifacts/aani-social/supabase/migrations/20270306000000_aani_sandbox_financial.sql || true
          fi
          if command -v pg_format >/dev/null 2>&1; then
            pg_format --check artifacts/aani-social/supabase/tests/sandbox_isolation.test.sql
          fi

      - name: Run SQL tests (isolated PostgreSQL)
        run: |
          # SQL tests require a live Supabase test instance with auth.uid() support.
          # They cannot run against plain PostgreSQL without Supabase extensions.
          # To run locally:
          #   1. Start a Supabase test instance (supabase start)
          #   2. Apply migration: supabase db push --linked
          #   3. Run tests: psql -f artifacts/aani-social/supabase/tests/sandbox_isolation.test.sql
          echo "SQL tests require a live Supabase test instance. See sandbox_isolation.test.sql for manual execution instructions."
        shell: bash

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            artifacts/aani-social/supabase/tests/sandbox_isolation.test.sql
          retention-days: 7