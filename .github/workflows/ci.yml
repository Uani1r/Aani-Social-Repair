name: CI

on:
  push:
    branches: [feat/aani-sandbox-financial]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Validate SQL syntax
        run: |
          # Validate SQL syntax using pg_format if available.
          # psql --dry-run is not used: it requires a live database connection,
          # and CI must not connect to production Supabase.
          if command -v pg_format >/dev/null 2>&1; then
            pg_format --check artifacts/aani-social/supabase/tests/sandbox_isolation.test.sql
            pg_format --check artifacts/aani-social/supabase/migrations/20270306000000_aani_sandbox_financial.sql
          else
            echo "pg_format not available; SQL syntax validation skipped"
            echo "SQL validation requires a live PostgreSQL/Supabase test instance"
            echo "Not connecting to production Supabase"
          fi

      - name: Run SQL tests (isolated Supabase/PostgreSQL)
        run: |
          # SQL tests are NOT executed in CI.
          # They require a live Supabase test instance with auth.uid() and RLS support.
          # They must not run against production Supabase.
          # Status: NOT EXECUTED — do not count as passed.
          echo "SQL tests: NOT EXECUTED in CI"
          echo "Status: not executed (requires isolated Supabase test instance)"
          echo "To run manually:"
          echo "  1. supabase start"
          echo "  2. supabase db push --linked"
          echo "  3. SET myapp.* variables"
          echo "  4. supabase db query --file artifacts/aani-social/supabase/tests/sandbox_isolation.test.sql"
        shell: bash

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            artifacts/aani-social/supabase/tests/sandbox_isolation.test.sql
          retention-days: 7