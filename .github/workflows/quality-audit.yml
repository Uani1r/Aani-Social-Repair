name: AANI Quality Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/aani-social/**'
      - 'e2e/**'
      - 'scripts/quality-audit/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/quality-audit.yml'

permissions:
  contents: read

concurrency:
  group: quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    name: فحص Chromium و WebKit ومحاكاة iPhone
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CI: 'true'
      # نمنع تنزيل المتصفحات أثناء pnpm install ثم نثبّتها صراحةً في خطوة مستقلة.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm-lock.yaml لم يُحدَّث بعد بإضافة @playwright/test، لذلك نسمح
      # بتحديثه داخل بيئة التشغيل. شغّل pnpm install محلياً مرة واحدة
      # لتثبيت الاعتمادية في ملف القفل ثم أعد الالتزام به.
      - name: تثبيت الاعتماديات
        run: pnpm install --no-frozen-lockfile

      - name: تثبيت متصفحات Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: تشغيل فحص الجودة
        run: pnpm run audit

      - name: توليد التقرير العربي
        if: always()
        run: pnpm run audit:report

      - name: رفع التقرير
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aani-quality-audit
          path: quality-audit-results
          retention-days: 14
          if-no-files-found: warn
