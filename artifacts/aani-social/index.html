<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="آني مساحة عربية لمشاركة لحظاتك اليومية واكتشاف أشخاص جدد." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="آني - Aani" />
    <meta property="og:description" content="مساحة عربية لمشاركة لحظاتك اليومية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="آني - Aani" />
    <meta name="twitter:description" content="مساحة عربية لمشاركة لحظاتك اليومية." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      /*
        خلفية آني تُرسم هنا قبل تحميل حزمة CSS، حتى لا تظهر صفحة بيضاء فارغة
        أثناء التحميل أو إذا تعذّر تحميل ملفات الواجهة.
      */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #09090b;
        color: #fafafa;
      }

      body {
        font-family: system-ui, -apple-system, 'Tajawal', 'Cairo', Tahoma, Arial, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .aani-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .aani-boot strong {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .aani-boot small {
        font-size: 12px;
        opacity: 0.65;
      }

      .aani-boot pre {
        margin: 12px 0 0;
        max-width: 90vw;
        padding: 12px;
        border-radius: 12px;
        background-color: #18181b;
        color: #fca5a5;
        font-size: 11px;
        line-height: 1.7;
        text-align: start;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-x: auto;
        direction: ltr;
      }
    </style>
    <script>
      /*
        حماية من الشاشة البيضاء: أي فشل في إقلاع الواجهة (ملف مفقود، مصدر غير
        مترجم، خطأ غير مُلتقَط) يظهر كرسالة مقروءة بدل صفحة فارغة.
        الحارس يتوقف بمجرد نجاح إقلاع التطبيق.
      */
      (function () {
        var failed = false;

        function fail(detail) {
          if (failed || window.aaniBooted) return;
          failed = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.textContent = '';
          var box = document.createElement('div');
          box.className = 'aani-boot';
          var title = document.createElement('strong');
          title.textContent = 'آني Aani';
          var note = document.createElement('small');
          note.textContent =
            'تعذّر تشغيل الواجهة. أعد تحميل الصفحة، وإن تكرّر الخطأ فالمشكلة في تحميل ملفات التطبيق.';
          box.appendChild(title);
          box.appendChild(note);
          if (detail) {
            var info = document.createElement('pre');
            info.textContent = String(detail);
            box.appendChild(info);
          }
          root.appendChild(box);
        }

        window.aaniBootFail = fail;

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target !== window && target.tagName === 'SCRIPT') {
              fail('SCRIPT LOAD FAILED: ' + (target.src || 'unknown'));
              return;
            }
            if (!target || target === window) {
              fail(
                (event.message || 'Uncaught error') +
                  (event.filename ? '\n' + event.filename + ':' + event.lineno : ''),
              );
            }
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          fail('Unhandled rejection: ' + (reason && reason.message ? reason.message : reason));
        });
      })();
    </script>
  </head>
  <body class="dark bg-zinc-950 text-white">
    <div id="root">
      <div class="aani-boot" role="status" aria-live="polite">
        <strong>آني Aani</strong>
        <small>جارٍ التحميل…</small>
      </div>
    </div>
    <noscript>
      <div class="aani-boot">
        <strong>آني Aani</strong>
        <small>يلزم تفعيل JavaScript في المتصفح لتشغيل التطبيق.</small>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
