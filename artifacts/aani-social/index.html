    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" />
    <script>
      try {
        const fonts = {
          alexandria: "'Alexandria', sans-serif",
          'ibm-plex-sans-arabic': "'IBM Plex Sans Arabic', sans-serif",
          tajawal: "'Tajawal', sans-serif",
          cairo: "'Cairo', sans-serif",
          'noto-sans-arabic': "'Noto Sans Arabic', sans-serif",
        };
        const savedFont = localStorage.getItem('aani_font_preference');
        const fontFamily = Object.prototype.hasOwnProperty.call(fonts, savedFont) ? fonts[savedFont] : fonts.alexandria;
        document.documentElement.style.setProperty('--app-font-family', fontFamily);
      } catch {
        document.documentElement.style.setProperty('--app-font-family', "'Alexandria', sans-serif");
      }
    </script>
    <script>
      // مراقب أخطاء الإقلاع: إن تعطل تحميل التطبيق قبل ظهور أي محتوى في
      // #root يُطبع نص الخطأ على الشاشة مباشرة بدل الشاشة البيضاء الصامتة
      // (مفيد للمعاينة من iPhone حيث لا يوجد تبويب Console).
      (function () {
        function formatReason(reason) {
          if (reason instanceof Error) return reason.stack || reason.message || String(reason);
          if (typeof reason === 'string') return reason;
          try { return JSON.stringify(reason); } catch (error) { return String(reason); }
        }
        function show(message) {
          try { console.error('[aani-boot]', message); } catch (error) { /* تجاهل */ }
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return; // التطبيق يعمل — الخطأ ليس إقلاعياً
          var panel = document.getElementById('aani-boot-error');
          if (!panel) {
            panel = document.createElement('pre');
            panel.id = 'aani-boot-error';
            panel.setAttribute('dir', 'rtl');
            panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;margin:0;overflow:auto;background:#18181b;color:#fca5a5;padding:20px;font:13px/1.8 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;';
            panel.textContent = 'تعذر إقلاع التطبيق (Aani Boot Error):\n\n';
            (document.body || document.documentElement).appendChild(panel);
            window.setInterval(function () {
              var currentRoot = document.getElementById('root');
              var currentPanel = document.getElementById('aani-boot-error');
              if (currentRoot && currentRoot.childElementCount > 0 && currentPanel) {
                currentPanel.remove();
              }
            }, 1000);
          }
          panel.textContent += message + '\n\n';
        }
        window.addEventListener('error', function (event) {
          var message = String(event.message || 'خطأ غير معروف');
          if (event.filename) message += '\n' + event.filename + ':' + event.lineno + ':' + event.colno;
          show(message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          show('Promise rejected: ' + formatReason(event.reason));
        });
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
