<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آني - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #121e1c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-card {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            background-color: #f7f8f5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Header & Logo */
        .header {
            padding: 25px 24px 10px 24px;
            display: flex;
            justify-content: flex-end;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            text-align: left;
        }

        .logo-text .en {
            font-size: 11px;
            color: #72827e;
            font-weight: 500;
            display: block;
        }

        .logo-text .ar {
            font-size: 18px;
            color: #1b352f;
            font-weight: 800;
            line-height: 1;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background-color: #1b352f;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
        }

        /* Main Section */
        .main-content {
            padding: 10px 28px 20px 28px;
            flex: 1;
        }

        .sub-greeting {
            color: #72827e;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #1b352f;
            margin-bottom: 8px;
        }

        .description {
            font-size: 13px;
            color: #83918d;
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1b352f;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid #e1e6e3;
            border-radius: 10px;
            background-color: #ffffff;
            font-size: 14px;
            color: #1b352f;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #1b352f;
            box-shadow: 0 0 0 3px rgba(27, 53, 47, 0.08);
        }

        .btn-submit {
            width: 100%;
            background-color: #1b352f;
            color: #ffffff;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #122521;
        }

        .btn-submit svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #72827e;
            font-weight: 500;
        }

        .signup-link a {
            color: #1b352f;
            font-weight: 700;
            text-decoration: none;
        }

        /* Bottom Hero Visual Banner */
        .bottom-banner {
            background-color: #1b352f;
            padding: 30px 28px 35px 28px;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .sun-wrapper {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            pointer-events: none;
        }

        .sun-core {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e38a68, #c66c4a);
            border-radius: 50%;
            top: 40px;
            right: 40px;
            z-index: 2;
        }

        .sun-ripples {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            top: 40px;
            right: 40px;
            box-shadow: 
                0 0 0 25px rgba(227, 138, 104, 0.18),
                0 0 0 55px rgba(227, 138, 104, 0.10),
                0 0 0 90px rgba(227, 138, 104, 0.04);
            z-index: 1;
        }

        .banner-text {
            position: relative;
            z-index: 3;
        }

        .banner-text .welcome {
            font-size: 13px;
            color: #a3bfb6;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .banner-text h3 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .banner-text p {
            font-size: 12px;
            color: #a3bfb6;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="app-card">
        
        <div>
            <!-- Header -->
            <header class="header">
                <div class="brand-logo">
                    <div class="logo-text">
                        <span class="ar">آني</span>
                        <span class="en">Aani</span>
                    </div>
                    <div class="logo-icon">آ</div>
                </div>
            </header>

            <!-- Login Form Section -->
            <main class="main-content">
                <p class="sub-greeting">سعدنا بعدوتك</p>
                <h1 class="title">أكمل حديثك.</h1>
                <p class="description">سجّل الدخول لتعود إلى مجتمعك.</p>

                <form>
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" placeholder="">
                    </div>

                    <button type="submit" class="btn-submit">
                        تسجيل الدخول
                        <svg viewBox="0 0 24 24">
                            <path d="M7 17L17 7M17 7H7M17 7V17"/>
                        </svg>
                    </button>
                </form>

                <div class="signup-link">
                    جديد هنا؟ <a href="#">أنشئ حساباً</a>
                </div>
            </main>
        </div>

        <!-- Bottom Banner Section -->
        <footer class="bottom-banner">
            <div class="sun-wrapper">
                <div class="sun-ripples"></div>
                <div class="sun-core"></div>
            </div>

            <div class="banner-text">
                <p class="welcome">أهلاً بك في آني</p>
                <h3>هنا،<br>يبدأ الحديث ببساطة.</h3>
                <p>مساحة عربية للحظاتك وأحاديثك...</p>
            </div>
        </footer>

    </div>

</body>
</html>
