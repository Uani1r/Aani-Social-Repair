    <!-- تثبيت التطبيق على الشاشة الرئيسية (PWA): الاسم والاختصار والاتجاه
         والألوان والأيقونات من manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple Web App: فتح بوضع standalone بعد «إضافة إلى الشاشة الرئيسية».
         iOS يشترط هذا الوضع لإشعارات الويب على iPhone/iPad. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="آني" />
    <!-- iOS لا يقرأ SVG كأيقونة شاشة رئيسية بعد؛ الرابط يخدم المتصفحات التي
         تقبله، والأيقونة الصحيحة على iOS تحتاج PNG مربعاً (180×180). -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- الخط الأساسي Alexandria مستضاف محلياً (preconnect لم يعد ضرورياً له) -->
    <link rel="preload" href="/fonts/alexandria-400.ttf" as="font" type="font/ttf" crossorigin>
    <!-- بقية خطوط اختيار الخط: تحميل غير حاجب للرسم الأول (print ثم all) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"></noscript>
