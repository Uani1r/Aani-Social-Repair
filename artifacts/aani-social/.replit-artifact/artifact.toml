kind = "web"
previewPath = "/"
title = "Aani Social"
description = "Aani is an Arabic-first social platform for sharing posts, stories, short videos, conversations, profiles, and notifications, with an optional protected AI assistant."
version = "1.0.0"
id = "artifacts/aani-social"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
# المعاينة تُوجَّه إلى منفذ Vite الذي يشغّله المسار الرئيسي الوحيد
# (.replit → bash scripts/dev-local.sh) — بلا مشغّل تطوير مكرر هنا
# لأن السكربت في جذر المشروع وتشغيله من داخل الـArtifact يكرر Vite
# فيتضاربان على 5000 (strictPort: true يُسقط أحدهما).
localPort = 5000

[services.production]
build = [ "pnpm", "--filter", "@workspace/aani-social", "run", "build" ]
serve = "static"
publicDir = "artifacts/aani-social/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
