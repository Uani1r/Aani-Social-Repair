kind = "web"
previewPath = "/"
title = "Aani Social"
description = "Aani is an Arabic-first social platform for sharing posts, stories, short videos, conversations, profiles, and notifications, with an optional protected AI assistant."
version = "1.0.0"
id = "artifacts/aani-social"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
# مسار التشغيل الوحيد أثناء التطوير: نفس سكربت .replit (API على 8080،
# Vite على 5000، تثبيت واحد للحزم، بلا عمليات قديمة متضاربة).
run = "bash scripts/dev-local.sh"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aani-social", "run", "build" ]
serve = "static"
publicDir = "artifacts/aani-social/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19949"
BASE_PATH = "/"
