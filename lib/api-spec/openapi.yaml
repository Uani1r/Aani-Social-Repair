openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: groups
    description: Group conversations and messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List the signed-in user's groups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groups the authenticated user belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupConversation"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group with selected connected users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupConversation"
        "400":
          description: Invalid group details
        "401":
          description: Authentication required
  /groups/{groupId}/messages:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listGroupMessages
      tags: [groups]
      summary: Get a group's message history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Group message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMessage"
        "403":
          description: User is not a group member
    post:
      operationId: sendGroupMessage
      tags: [groups]
      summary: Send a message to a group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendGroupMessageRequest"
      responses:
        "201":
          description: Saved group message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMessage"
        "403":
          description: User is not a group member
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GroupConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        creatorId:
          type: string
          format: uuid
        members:
          type: array
          items:
            type: string
            format: uuid
        avatar:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, creatorId, members, avatar, createdAt]
    GroupMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, groupId, senderId, content, createdAt]
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        members:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
      required: [name, members]
    SendGroupMessageRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 4000
      required: [content]
